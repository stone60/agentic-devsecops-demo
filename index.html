<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テック株式会社</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="logo">テック株式会社</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <h1>未来を創るIT</h1>
        <p class="hero-sub">最先端のテクノロジーで社会の課題を解決します</p>
        <a href="#" class="btn-primary">お問い合わせはこちら</a>
      </div>
    </section>

    <section class="services">
      <div class="container">
        <h2>事業内容</h2>
        <div class="service-grid">
          <div class="service-card">
            <h3>開発</h3>
            <p>Webシステムからモバイルアプリまで、高品質なソフトウェア開発を行ないます。</p>
          </div>
          <div class="service-card">
            <h3>デザイン</h3>
            <p>ユーザー体験（UX）と美しさを両立したUI/UXデザインを提案します。</p>
          </div>
          <div class="service-card">
            <h3>コンサル</h3>
            <p>IT戦略の立案から導入支援まで、ビジネスのDX推進を強力にサポートします。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; テック株式会社 All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
